<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>หน้าร้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>หน้าร้าน</h1><p id="today"></p></header>
<main><form id="login" style="display:none;margin-top:20px"><input id="em" type="email" placeholder="อีเมล" autocomplete="username"><input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"><button class="cta"><span>เข้าสู่ระบบ</span></button><div class="err" id="err"></div></form>
<div id="app" style="display:none"><div class="sum" id="sum"></div><h2>รอทำ</h2><div id="new"></div><h2>ทำเสร็จแล้ว รอเก็บเงิน</h2><div id="ready"></div><a href="history.html" style="display:block;margin:18px 4px;font-weight:700;color:inherit">📊 ประวัติยอดขาย / แก้ไขบิล</a><button class="x" id="out">ออกจากระบบ</button></div></main>
<script type="module">
import{auth,db,MENU,day,signInWithEmailAndPassword,onAuthStateChanged,signOut,collection,query,where,onSnapshot,doc,updateDoc}from"./common.js";
const $=i=>document.getElementById(i),P={};MENU.forEach(m=>P[m.id]=m);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tot=o=>(o.items||[]).reduce((s,i)=>s+(P[i.id]?P[i.id].p*(+i.q||0):0),0),baht=n=>n.toLocaleString("th-TH");
let ac,orders=[],first=true,unsub=null;
document.addEventListener("click",()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}});
function beep(){if(!ac)return;[0,.25,.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.3;o.start(s);o.stop(s+.15)})}
$("today").textContent="วันที่ "+day();
$("login").onsubmit=async e=>{e.preventDefault();$("err").textContent="";try{await signInWithEmailAndPassword(auth,$("em").value,$("pw").value)}catch(x){$("err").textContent="อีเมลหรือรหัสผ่านไม่ถูกต้อง"}};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{const ok=u&&!u.isAnonymous;$("login").style.display=ok?"none":"block";$("app").style.display=ok?"block":"none";unsub&&unsub();unsub=null;
if(ok){first=true;unsub=onSnapshot(query(collection(db,"orders"),where("day","==",day())),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));if(!first&&s.docChanges().some(c=>c.type==="added"))beep();first=false;render()})}});
const card=(o,btns)=>`<div class="oc"><div class="h"><span>คิว ${o.queue}${o.name?" · "+esc(o.name):""}</span><span>${baht(tot(o))} บาท</span></div>${(o.items||[]).map(i=>P[i.id]?`<div>${i.q} × ${P[i.id].n}${(i.o||[]).length?`<small>ซอส: ${(i.o||[]).map(esc).join(" + ")}</small>`:""}</div>`:"").join("")}${o.note?`<div style="margin-top:6px;font-weight:500">📝 ${esc(o.note)}</div>`:""}<div class="btns">${btns}</div></div>`;
function render(){const by=s=>orders.filter(o=>o.status===s).sort((a,b)=>a.queue-b.queue),can=id=>`<button class="g" data-id="${id}" data-st="cancelled">ยกเลิก</button>`;
$("new").innerHTML=by("new").map(o=>card(o,`<button data-id="${o.id}" data-st="ready">ทำเสร็จแล้ว</button>${can(o.id)}`)).join("")||'<div class="msg">ไม่มีออเดอร์ค้าง</div>';
$("ready").innerHTML=by("ready").map(o=>card(o,["cash:เงินสด","transfer:โอน","gov:โครงการรัฐ"].map(x=>`<button data-id="${o.id}" data-st="paid" data-pay="${x.split(":")[0]}">เก็บเงินแล้ว (${x.split(":")[1]})</button>`).join("")+can(o.id))).join("")||'<div class="msg">ไม่มี</div>';
const paid=orders.filter(o=>o.status==="paid"),sm=k=>paid.filter(o=>o.pay===k).reduce((s,o)=>s+(o.total||0),0);
$("sum").innerHTML=`<div>ยอดรวมวันนี้<b>${baht(paid.reduce((s,o)=>s+(o.total||0),0))}</b></div><div>เงินสด<b>${baht(sm("cash"))}</b></div><div>โอน<b>${baht(sm("transfer"))}</b></div><div>โครงการรัฐ<b>${baht(sm("gov"))}</b></div><div>บิลที่ปิดแล้ว<b>${paid.length}</b></div>`}
$("app").addEventListener("click",async e=>{const b=e.target.closest("button[data-st]");if(!b)return;const d=b.dataset,o=orders.find(x=>x.id===d.id);if(!o)return;
if(d.st==="cancelled"&&!confirm("ยกเลิกออเดอร์คิว "+o.queue+"?"))return;
const u={status:d.st};if(d.st==="paid"){u.pay=d.pay;u.total=tot(o)}try{await updateDoc(doc(db,"orders",d.id),u)}catch(x){alert("บันทึกไม่สำเร็จ ลองใหม่")}});
</script></body></html>
